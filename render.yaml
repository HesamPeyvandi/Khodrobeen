services:
  - type: web
    name: khodrobeen
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "python main.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PANEL_USERNAME
        value: admin
      - key: ADMIN_PANEL_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
        # Defaults to local SQLite if left unset in the Render dashboard.
        # Render's free plan has no persistent disk, so SQLite gets wiped on
        # every redeploy - set this to a free Neon Postgres connection
        # string instead (see README's "Deploying to Render" section).
      - key: POLL_INTERVAL_SECONDS
        value: "180"
      - key: HEADLESS_BROWSER
        value: "true"
      - key: PAYMENT_PROVIDER
        value: manual
